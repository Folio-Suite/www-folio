name: Package documentation release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published UndoKit release version
        required: true
        type: string
      source_sha256:
        description: Reviewed SHA-256 of UndoKit documentation archive asset
        required: true
        type: string
      release_sha256:
        description: Reviewed SHA-256 of published UndoKit release manifest
        required: true
        type: string
      publish:
        description: Publish an immutable website asset after verification
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: documentation-asset-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify release inputs and transform the original DocC archive
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha256 }}
          RELEASE_SHA: ${{ inputs.release_sha256 }}
        run: node scripts/documentation/build-release.mjs --version "$VERSION" --source-sha256 "$SOURCE_SHA" --release-sha256 "$RELEASE_SHA" --output artifact
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-release
          path: artifact/
          if-no-files-found: error
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    environment: documentation-assets
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: documentation-release
          path: artifact
      - name: Publish without replacing a prior asset or changing the website
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release create "undokit-docs-$VERSION-site-v1" "artifact/UndoKit-$VERSION-website.tar.gz" artifact/lock-entry.json --target "$SOURCE_REVISION" --title "UndoKit $VERSION website artifact" --notes "Verified website derivative of the published UndoKit documentation. Adopt the attached lock entry in a reviewed source change to update the website." --latest=false
